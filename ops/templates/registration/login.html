<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center overflow-hidden relative">
    <div class="absolute w-[500px] h-[500px] rounded-full bg-violet-600/10 blur-[120px] -top-40 -left-40 animate-pulse"></div>
    <div class="absolute w-[500px] h-[500px] rounded-full bg-indigo-600/10 blur-[120px] -bottom-40 -right-40 animate-pulse"></div>

    <div class="w-full max-w-md p-8 bg-slate-900/60 border border-slate-800/80 backdrop-blur-xl rounded-2xl shadow-2xl z-10">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-violet-400 via-indigo-400 to-emerald-400 bg-clip-text text-transparent">NMS</h1>
            <p class="text-slate-400 mt-2 font-light">Naishoku Management System</p>
        </div>

        <form method="post" action="{% url 'login' %}" class="space-y-6">
            {% csrf_token %}
            {% if form.errors %}
                <div class="p-4 bg-red-950/40 border border-red-800/60 text-red-300 rounded-lg text-sm">
                    Usuário ou senha incorretos.
                </div>
            {% endif %}
            
            <div class="space-y-2">
                <label for="id_username" class="block text-sm font-semibold text-slate-300">Usuário</label>
                <input type="text" name="username" id="id_username" required
                    class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 focus:border-violet-500/80 focus:ring-1 focus:ring-violet-500 rounded-xl outline-none transition text-slate-200"
                    placeholder="Seu usuário de acesso">
            </div>

            <div class="space-y-2">
                <label for="id_password" class="block text-sm font-semibold text-slate-300">Senha</label>
                <input type="password" name="password" id="id_password" required
                    class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 focus:border-violet-500/80 focus:ring-1 focus:ring-violet-500 rounded-xl outline-none transition text-slate-200"
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full py-3 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 active:scale-[0.98] font-bold text-white rounded-xl shadow-lg shadow-violet-950/50 transition">
                Entrar no Sistema
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-slate-500">
            Acesso externo para trabalhadores? 
            <a href="{% url 'contingency_go_endpoint' %}" class="text-violet-400 hover:underline">Use o código curto</a>
        </div>
    </div>
</body>
</html>
